[package]
edition = "2021"
name = "daat-locus-md"
version = "0.3.6"
description = "Fork of daat-locus-md v0.3.6 with ratatui 0.30 support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shadow3aaa/daat-locus-md"

[features]
default = []
markdown = []
highlight = ["dep:tree-sitter"]
image = ["dep:image"]
mermaid = []
scroll = []
tree = ["dep:serde_json", "dep:toml"]
preview = ["markdown", "scroll", "tree"]
viewer = ["markdown", "scroll"]

[dependencies]
ratatui = "0.30"
unicode-width = "0.2"
pest = "2.8"
pest_derive = "2.8"
anyhow = "1"
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }
serde_json = { version = "1.0.150", optional = true }
toml = { version = "0.8.23", optional = true }
tree-sitter = { version = "0.25.10", optional = true }

[lib]
name = "daat_locus_md"
path = "src/lib.rs"
doctest = false
